name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install X11 test tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb xdotool libx11-6 libxext6 libgl1 libegl1 libx11-xcb1
          libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0
          libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0
          libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0
          libxcb-xkb1
      - run: uv sync --locked
      - run: npm ci --prefix extension --no-audit --no-fund
      - name: Unit, installer, manifest and build checks
        run: ./scripts/check.sh
      - name: Native X11 input routing and stable geometry
        run: xvfb-run -a uv run test_desktop.py
      - name: Package committed source
        run: ./scripts/pack.sh
